name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-summary-cards

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Generate Profile Summary Cards
        uses: vn7n24f1t5/github-profile-summary-cards@main
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: tokyonight
