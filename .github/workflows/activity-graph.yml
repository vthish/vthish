name: Update Activity Graph

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/activity-graph.yml"
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate activity graph (attempt 1)
        id: generate_activity_graph_attempt_1
        continue-on-error: true
        uses: maurodesouza/github-readme-activity-graph-action@v2
        with:
          username: ${{ github.repository_owner }}
          options: theme=tokyo-night&hide_border=true&area=true
          output_path: dist/activity-graph.svg
          token: ${{ secrets.PROFILE_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate activity graph (retry on transient failure)
        id: generate_activity_graph_attempt_2
        if: steps.generate_activity_graph_attempt_1.outcome == 'failure'
        uses: maurodesouza/github-readme-activity-graph-action@v2
        with:
          username: ${{ github.repository_owner }}
          options: theme=tokyo-night&hide_border=true&area=true
          output_path: dist/activity-graph.svg
          token: ${{ secrets.PROFILE_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Fail workflow when graph generation fails twice
        if: steps.generate_activity_graph_attempt_1.outcome == 'failure' && steps.generate_activity_graph_attempt_2.outcome == 'failure'
        run: exit 1

      - name: Publish activity graph
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
